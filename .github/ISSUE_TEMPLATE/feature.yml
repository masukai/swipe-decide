name: Feature request
description: Suggest a useful improvement.
title: "[Feature] "
body:
  - type: textarea
    id: use-case
    attributes:
      label: What is your use case?
      description: Start with what you are trying to decide or accomplish.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Share workarounds, examples, or related ideas if useful.

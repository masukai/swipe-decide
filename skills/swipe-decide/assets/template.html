<title>スワイプ意思決定</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト: 1画面完結。上=進捗とコンボ / 中=カードの山 / 下=操作ボタン。全部決めたら結果画面に切り替わる。
   見た目は2軸。data-look(calm / pop / flashy)=形・書体・動き、data-mode(auto / light / dark)=配色 */
/* 配色と形は、スタイル(data-look)× 明暗(data-scheme)で決まる。data-scheme は JS が mode と端末の設定から決める。
   スタイルごとに別の世界観: calm=判子と和紙 / pop=昭和の印刷物 / flashy=ネオン */
:root{
  /* pop・ライト(既定) */
  --ink:#f1e6c6; --ink-2:#e3d6b0; --line:rgba(21,21,21,.3); --text:#151515; --mute:#5c5238;
  --yes:#1a7a50; --no:#d92f22; --later:#8a5a00; --info:#1d4e9e; --on-accent:#fff;
  --blend:multiply; --shadow:5px 5px 0 #151515; --amb0:transparent;
  /* 紙(カード)はどちらの明暗でも明るい色。紙の上に載せる色もここで固定 */
  --paper:#fffdf5; --paper-ink:#151515; --paper-mute:#5c5238;
  --yes-d:#1a7a50; --no-d:#d92f22; --later-d:#8a5a00; --info-d:#1d4e9e;
  --hard:#151515; --hard-sh:#151515;
  --f-display:'RocknRoll One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --w-d:400; --r-card:10px; --deco:1; --rot:1; --st-size:34px; --st-bw:4px; --amb-op:0; --q-base:26px;
  color-scheme:light;
}
:root[data-scheme="dark"]{
  --ink:#1b1a17; --ink-2:#2b2923; --line:rgba(241,230,198,.3); --text:#f1e6c6; --mute:#b3a888;
  --yes:#3fcf8e; --no:#ff5a4d; --later:#ffbf1f; --info:#6aa0ff; --on-accent:#151515;
  --blend:screen; --shadow:5px 5px 0 #f1e6c6; --hard-sh:#f1e6c6;
  color-scheme:dark;
}
/* calm: 判子と和紙 */
:root[data-look="calm"]{
  --ink:#ece4d3; --ink-2:#ddd3bd; --line:rgba(40,30,15,.24); --text:#201b12; --mute:#6a604b;
  --yes:#2f6f55; --no:#b3261e; --later:#8a5c0c; --info:#3a5a7a; --on-accent:#fff;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 16px rgba(60,40,10,.16);
  --paper:#fbf7ee; --paper-ink:#201b12; --paper-mute:#6d634f;
  --yes-d:#2f6f55; --no-d:#b3261e; --later-d:#8a5c0c; --info-d:#3a5a7a; --hard:#201b12; --hard-sh:#201b12;
  --f-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --w-d:800; --r-card:3px; --deco:0; --rot:0; --st-size:30px; --st-bw:3px; --amb-op:0; --q-base:23px;
}
:root[data-look="calm"][data-scheme="dark"]{
  --ink:#171410; --ink-2:#26211a; --line:rgba(255,255,255,.16); --text:#efe7d6; --mute:#a79c84;
  --yes:#58b08c; --no:#e0574b; --later:#d9a441; --info:#7fa3c6; --on-accent:#171410;
  --shadow:0 10px 24px rgba(0,0,0,.5);
}
/* flashy: ネオン(紫は使わない) */
:root[data-look="flashy"]{
  --ink:#f4f1ea; --ink-2:#e6e1d6; --line:rgba(20,20,20,.14); --text:#141414; --mute:#5b564c;
  --yes:#0a8262; --no:#d41c44; --later:#a86600; --info:#2f58d8; --on-accent:#fff;
  --shadow:0 14px 30px rgba(0,0,0,.2); --amb0:rgba(255,71,102,.14);
  --paper:#fffaf1; --paper-ink:#141414; --paper-mute:#5f594e;
  --yes-d:#087a5c; --no-d:#d41c44; --later-d:#a86600; --info-d:#2f58d8; --hard:#141414; --hard-sh:#141414;
  --f-display:'Dela Gothic One','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --w-d:400; --r-card:32px; --deco:1; --rot:1.7; --st-size:46px; --st-bw:6px; --amb-op:1; --q-base:28px;
}
:root[data-look="flashy"][data-scheme="dark"]{
  --ink:#0d0d0f; --ink-2:#1b1b1f; --line:rgba(255,255,255,.16); --text:#f5f2ea; --mute:#a9a69c;
  --yes:#12d6a0; --no:#ff4766; --later:#ffc02e; --info:#6a8dff; --on-accent:#0d0d0f;
  --shadow:0 20px 44px rgba(0,0,0,.5); --amb0:rgba(255,71,102,.24);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text); font-family:var(--f-body); font-size:15px;
  padding-block:10px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
}
body[data-heat="1"]{--amb:rgba(18,214,160,.30)}
body[data-heat="2"]{--amb:rgba(255,192,46,.34)}
body[data-heat="3"]{--amb:rgba(255,71,102,.42)}
body.shake{animation:shake .38s}
body.shake-s{animation:shakes .24s}
@keyframes shakes{0%,100%{transform:translate(0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}

#app{height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
#app::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--amb-op);
  background:radial-gradient(90% 55% at 50% 108%,var(--amb,var(--amb0)),transparent 65%)}
.glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:var(--blend);
  background:radial-gradient(85% 60% at 50% 55%,var(--g,#12d6a0),transparent 70%)}
.top,.stage,.controls,.hint,.done{position:relative;z-index:1}

/* 上部: 進捗 + コンボ */
.top{display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.sample{font:700 11px var(--f-body);letter-spacing:.16em;color:var(--on-accent);background:var(--later);padding:3px 8px;border-radius:999px}
#count{font:var(--w-d) 14px var(--f-display);letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums;flex:1}
.gear{border:0;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);color:var(--text)}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.gear:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.bar{display:flex;gap:4px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.seg.cur{background:var(--mute)}
.seg[data-c="yes"]{background:var(--yes)}
.seg[data-c="no"]{background:var(--no)}
.seg[data-c="later"]{background:var(--later)}
.combo{height:34px;display:flex;align-items:center;font-family:var(--f-display);font-weight:var(--w-d);letter-spacing:.04em;color:var(--text)}
.cw{font-size:.62em;margin-right:.3em}
.combo[data-lv="1"]{font-size:20px;color:var(--yes)}
.combo[data-lv="2"]{font-size:26px;color:var(--later)}
.combo[data-lv="3"]{font-size:32px;color:var(--no);text-shadow:0 0 18px rgba(255,71,102,.5)}
.combo.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}60%{transform:scale(1.22) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* カードの山 */
.stage{flex:1;min-height:0;width:100%;max-width:400px;margin:0 auto;touch-action:none}
.card{
  position:absolute;inset:0 0 40px 0;border-radius:var(--r-card);padding:22px 22px 18px;
  background:var(--paper);color:var(--paper-ink);
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;overflow:hidden;
  box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.7),0 0 0 1px var(--line);
  transition:transform .46s cubic-bezier(.2,1.25,.35,1),opacity .3s;
  will-change:transform;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.card::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:hsl(var(--hue) 90% 60% / .16);opacity:var(--deco);pointer-events:none}
.card.drag{transition:none}
.card.fly{transition:transform .36s cubic-bezier(.3,.1,.6,1),opacity .36s ease-in}
/* 派手: 虹色に流れる縁、脈打つネオン、色相が回る背景、虹色のコンボ文字 */
:root[data-look="flashy"] .card{
  border:5px solid transparent;
  background:linear-gradient(var(--paper),var(--paper)) padding-box,
    linear-gradient(120deg,#ff4766,#ffc02e,#12d6a0,#6a8dff,#ff6bd6,#ff4766) border-box;
  background-size:100% 100%,300% 300%;
  animation:sweep 1.4s linear infinite,neon 1s ease-in-out infinite alternate;
}
@keyframes sweep{to{background-position:0 0,300% 0}}
@keyframes neon{
  from{box-shadow:0 0 16px rgba(255,71,102,.6),0 0 46px rgba(106,141,255,.4),var(--shadow)}
  to{box-shadow:0 0 28px rgba(18,214,160,.7),0 0 74px rgba(255,192,46,.45),var(--shadow)}
}
:root[data-look="flashy"] #app::before{
  background:radial-gradient(70% 45% at 15% 105%,rgba(255,71,102,.6),transparent 65%),
    radial-gradient(70% 45% at 85% 105%,rgba(18,214,160,.55),transparent 65%),
    radial-gradient(60% 35% at 50% -5%,rgba(255,192,46,.4),transparent 65%);
  animation:hue 4s ease-in-out infinite alternate;
}
:root[data-look="flashy"] body[data-heat="2"] #app::before{animation-duration:2.4s}
:root[data-look="flashy"] body[data-heat="3"] #app::before{animation-duration:1.1s}
@keyframes hue{from{filter:hue-rotate(-35deg)}to{filter:hue-rotate(35deg)}}
:root[data-look="flashy"] .stamp{text-shadow:0 0 14px currentColor;background:rgba(255,250,241,.9)}
:root[data-look="flashy"] .st-yes::after,:root[data-look="flashy"] .st-no::after{content:"!!"}
:root[data-look="flashy"] .combo{height:50px}
:root[data-look="flashy"] .combo[data-lv]{
  background:linear-gradient(90deg,#ff4766,#ffc02e,#12d6a0,#6a8dff,#ff6bd6,#ff4766);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;white-space:nowrap;
  animation:rainbow 1s linear infinite;
}
:root[data-look="flashy"] .combo[data-lv="1"]{font-size:30px}
:root[data-look="flashy"] .combo[data-lv="2"]{font-size:36px}
:root[data-look="flashy"] .combo[data-lv="3"]{font-size:42px}
:root[data-look="flashy"] .combo.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1),rainbow 1s linear infinite}
:root[data-look="flashy"] .cw{font-size:.5em}
@keyframes rainbow{to{background-position:200% 0}}
:root[data-look="flashy"] #d-head{
  background:linear-gradient(90deg,#ff4766,#ffc02e,#12d6a0,#6a8dff,#ff6bd6,#ff4766);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 1.2s linear infinite;
}
.meta{display:flex;align-items:center;justify-content:space-between;position:relative}
.tag{font:900 12px var(--f-body);letter-spacing:.08em;padding:5px 12px;border-radius:999px;
  background:hsl(var(--hue) 85% 91%);color:hsl(var(--hue) 55% 28%)}
.num{font:var(--w-d) 13px var(--f-display);color:var(--paper-mute);font-variant-numeric:tabular-nums}
.body{display:grid;gap:16px;position:relative}
.q{margin:0;font:var(--w-d) var(--q-base)/1.4 var(--f-display);text-wrap:balance;word-break:auto-phrase;line-break:strict}
.why{margin:0;font:500 15px/1.7 var(--f-body);color:var(--paper-mute);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.q{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7;overflow:hidden}
.q[data-len="m"]{font-size:calc(var(--q-base) - 4px)}
.q[data-len="l"]{font-size:calc(var(--q-base) - 8px);line-height:1.35}
.q[data-len="xl"]{font-size:calc(var(--q-base) - 11px);line-height:1.3}
.card .meta,.card .rec{flex:none}
.card .body{min-height:0;overflow:hidden}
.why b{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:6px;background:var(--paper-ink);color:var(--paper);font:900 11px var(--f-body);letter-spacing:.1em;vertical-align:1px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 12px var(--f-body);color:var(--paper-mute);opacity:.7;position:relative}
.chip{font-style:normal;font:var(--w-d) 13px var(--f-display);padding:4px 12px;border-radius:999px;color:#fff}
.chip[data-c="yes"]{background:var(--yes-d)}
.chip[data-c="no"]{background:var(--no-d)}
.chip[data-c="later"]{background:var(--later-d)}
.stamp{position:absolute;font:var(--w-d) var(--st-size) var(--f-display);padding:2px 14px;border:var(--st-bw) solid currentColor;border-radius:12px;pointer-events:none;letter-spacing:.04em;background:rgba(255,250,241,.7)}
.st-yes{top:62px;left:18px;color:var(--yes-d);transform:rotate(calc(-13deg * var(--rot)));opacity:var(--s-yes,0)}
.st-no{top:62px;right:18px;color:var(--no-d);transform:rotate(calc(13deg * var(--rot)));opacity:var(--s-no,0)}
.st-later{top:42%;left:50%;transform:translateX(-50%) rotate(calc(-4deg * var(--rot)));color:var(--later-d);opacity:var(--s-later,0);white-space:nowrap}
.st-info{bottom:64px;left:50%;transform:translateX(-50%) rotate(calc(3deg * var(--rot)));color:var(--info-d);opacity:var(--s-info,0);white-space:nowrap}

/* 操作ボタン */
.hint{text-align:center;font:500 12px var(--f-body);color:var(--mute);letter-spacing:.04em;margin:0}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;padding-top:2px}
.btn{border:0;cursor:pointer;display:grid;place-items:center;border-radius:50%;background:var(--ink-2);color:var(--c);
  box-shadow:inset 0 0 0 2px var(--c);transition:transform .12s,background .12s,color .12s}
.btn:active{transform:scale(.88);background:var(--c);color:var(--on-accent)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.btn.lg{width:68px;height:68px}.btn.md{width:52px;height:52px}.btn.sm{width:44px;height:44px}
.btn svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.b-no{--c:var(--no)}.b-yes{--c:var(--yes)}.b-later{--c:var(--later)}.b-info{--c:var(--info)}.b-undo{--c:var(--mute)}

/* シート(詳細・設定) */
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(10,6,28,.62)}
.sheet-in{max-height:88vh;overflow:auto;width:100%;max-width:440px;margin:0 auto;background:var(--paper);color:var(--paper-ink);
  border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .3s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0;font:var(--w-d) 20px/1.45 var(--f-display);text-wrap:balance;word-break:auto-phrase}
.sheet p{margin:0;font:500 15px/1.8 var(--f-body);color:var(--paper-mute)}
.sheet .tag{justify-self:start}
.sheet-rec{display:flex;align-items:center;gap:8px;font:700 13px var(--f-body);color:var(--paper-mute)}
.risk{font:900 11px var(--f-body);letter-spacing:.1em;padding:4px 10px;border-radius:999px;background:var(--no-d);color:#fff}
.lhs{display:flex;align-items:center;gap:8px;min-width:0}
.ifno{margin:0;font:700 13px/1.6 var(--f-body);color:var(--paper-mute);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ifno b{color:var(--no-d);margin-right:6px}
.ob{display:grid;gap:8px}
.ob button{text-align:left;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;background:hsl(var(--hue) 80% 94%);color:var(--paper-ink);
  font:700 15px/1.4 var(--f-body);box-shadow:inset 0 0 0 2px hsl(var(--hue) 45% 82%);transition:transform .1s}
.ob button[data-rec="1"]{box-shadow:inset 0 0 0 2px var(--yes-d)}
.ob button small{display:block;font:500 12px/1.5 var(--f-body);color:var(--paper-mute);margin-top:2px}
.ob button:active{transform:scale(.97)}
.ob button:focus-visible{outline:3px solid var(--info-d);outline-offset:2px}
.card[data-kind="pick"] .why{display:none}
.card[data-kind="pick"] .chip{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;background:hsl(var(--hue,250) 70% 95%);color:var(--paper-ink);box-shadow:inset 0 0 0 2px hsl(var(--hue,250) 40% 84%)}
.so[data-rec="1"]{box-shadow:inset 0 0 0 2px var(--yes-d)}
.so b{display:flex;align-items:center;gap:8px;font:700 15px/1.4 var(--f-body)}
.so span{display:block;margin-top:4px;font:500 13px/1.7 var(--f-body);color:var(--paper-mute)}
.so:active{transform:scale(.98)}
#s-opts{display:grid;gap:8px}
#s-opts:empty{display:none}
.pick.two{grid-template-columns:repeat(2,1fr)}
.pick [data-cf="back"]{background:var(--later-d)}
.pick [data-cf="ok"]{background:var(--yes-d)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:0;border-radius:14px;padding:13px 4px;cursor:pointer;font:var(--w-d) 16px var(--f-display);color:#fff}
.pick button:focus-visible,.cta:focus-visible,.close:focus-visible{outline:3px solid var(--info-d);outline-offset:2px}
.pick [data-pick="yes"]{background:var(--yes-d)}
.pick [data-pick="no"]{background:var(--no-d)}
.pick [data-pick="later"]{background:var(--later-d)}
.close{justify-self:center;border:0;background:none;color:var(--paper-mute);font:700 13px var(--f-body);padding:6px 12px;cursor:pointer}
.srow{display:grid;gap:8px}
.slabel{font:900 12px var(--f-body);letter-spacing:.1em;color:var(--paper-mute)}
.sopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:0;border-radius:12px;padding:12px 4px;cursor:pointer;font:700 14px var(--f-body);background:rgba(28,22,64,.09);color:var(--paper-ink)}
.opt[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
.opt:focus-visible{outline:3px solid var(--info-d);outline-offset:2px}

/* 結果画面 */
.done{flex:1;min-height:0;overflow-y:auto;padding-bottom:6px}
.done-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kicker{margin:0;font:var(--w-d) 13px var(--f-display);letter-spacing:.16em;color:var(--yes)}
#d-head{margin:0;font:var(--w-d) 30px/1.3 var(--f-display);text-wrap:balance}
.save{margin:0;padding:10px 14px;border-radius:14px;font:700 13px/1.5 var(--f-body);background:var(--ink-2);color:var(--mute)}
.save[data-s="ok"]{color:var(--yes);box-shadow:inset 0 0 0 2px var(--yes)}
.save[data-s="none"],.save[data-s="fail"]{color:var(--later);box-shadow:inset 0 0 0 2px var(--later)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--ink-2);border-radius:18px;padding:12px 10px;display:grid;gap:2px}
.tile b{font:var(--w-d) 34px/1.1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.tile span{font:700 12px var(--f-body);color:var(--mute)}
.agree{margin:0;font:500 14px/1.6 var(--f-body);color:var(--mute)}
.agree strong{color:var(--text)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.lab{font:var(--w-d) 12px var(--f-display);text-align:center;padding:5px 0;border-radius:999px;color:var(--on-accent)}
.lab[data-c="yes"]{background:var(--yes)}
.lab[data-c="no"]{background:var(--no)}
.lab[data-c="later"]{background:var(--later)}
.row p{margin:0;font:700 14px/1.55 var(--f-body)}
.row small{display:block;margin-top:2px;font:500 12px var(--f-body);color:var(--later)}
.actions{position:sticky;bottom:0;display:flex;gap:10px;padding:16px 0 2px;background:linear-gradient(to top,var(--ink) 68%,transparent)}
.cta{flex:1;border:0;border-radius:16px;padding:15px 8px;font:900 16px var(--f-body);cursor:pointer}
.cta.main{background:var(--yes);color:var(--on-accent);flex:2}
.cta.sub{background:var(--ink-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.cta:active{transform:scale(.97)}
details{color:var(--mute);font:500 13px var(--f-body)}
summary{cursor:pointer;padding:6px 0}
textarea{width:100%;min-height:140px;margin-top:6px;background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;
  background:var(--text);color:var(--ink);font:700 14px var(--f-body);padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .card,.card.fly{transition-duration:.01s}
  :root[data-look="flashy"] .card,:root[data-look="flashy"] #app::before,:root[data-look="flashy"] .combo[data-lv],
  :root[data-look="flashy"] .combo.pop,:root[data-look="flashy"] #d-head{animation:none}
  .combo.pop,body.shake,body.shake-s,.sheet-in{animation:none}
}
@media (max-height:640px){.q{font-size:calc(var(--q-base) - 4px)}.card{padding:18px 18px 14px}}
/* 低い画面(小さなウィンドウ・横向きのスマホ)では、カードの中身を詰めて収める */
@media (max-height:560px){
  #app{gap:6px}
  .card{inset:0 0 30px 0;padding:12px 14px 10px;gap:8px}
  .card .body{gap:8px}
  .q{font-size:calc(var(--q-base) - 8px)}
  .why{font-size:13px;-webkit-line-clamp:2}
  .ob{gap:5px}
  .ob button{padding:6px 12px;font-size:13px}
  .ob button small{display:none}
  .hint{display:none}
}
@media (max-height:440px){
  .why,.ifno{display:none}
  .q{font-size:calc(var(--q-base) - 11px)}
  .card{padding:10px 12px 8px;gap:6px}
  .ob button{padding:4px 10px;font-size:12px}
}

/* ---- スタイルごとの部品の見た目 ---- */
.sheet{background:rgba(10,8,4,.62)}
.opt{background:rgba(0,0,0,.08)}
.save,.tile,.cta,.lab,.risk{border-radius:12px}
.risk{border-radius:999px}
/* calm: 判子と和紙。朱の判子、明朝の見出し、細い罫線 */
:root[data-look="calm"] .tag{background:transparent;color:var(--paper-ink);border:1px solid var(--paper-ink);border-radius:2px;letter-spacing:.14em;padding:3px 10px}
:root[data-look="calm"] .chip,:root[data-look="calm"] .lab,:root[data-look="calm"] .sample,:root[data-look="calm"] .risk{border-radius:3px}
:root[data-look="calm"] .save,:root[data-look="calm"] .tile,:root[data-look="calm"] .cta{border-radius:6px}
:root[data-look="calm"] .stamp{color:#c0291b;background:transparent;border-radius:5px;mix-blend-mode:multiply;letter-spacing:.14em}
:root[data-look="calm"] .seg{height:3px;border-radius:0}
:root[data-look="calm"] .btn,:root[data-look="calm"] .gear{border-radius:10px}
:root[data-look="calm"] .ob button,:root[data-look="calm"] .so{background:transparent;border-radius:4px;box-shadow:inset 0 0 0 1px var(--paper-ink)}
:root[data-look="calm"] .ob button[data-rec="1"],:root[data-look="calm"] .so[data-rec="1"]{box-shadow:inset 0 0 0 2px var(--yes-d)}
:root[data-look="calm"] .sheet-in{border-radius:6px 6px 0 0}
:root[data-look="calm"] .pick button,:root[data-look="calm"] .opt{border-radius:6px}
/* pop: 昭和の印刷物。太い黒枠、ずらした影、網点、黄色のタグ */
:root[data-look="pop"] .card{border:3px solid var(--hard);box-shadow:var(--shadow)}
:root[data-look="pop"] .card::before{width:150px;height:150px;right:-30px;top:-30px;border-radius:0;opacity:.55;
  background:radial-gradient(circle,#e63b2e 2.2px,transparent 2.8px) 0 0/10px 10px;
  -webkit-mask:linear-gradient(225deg,#000,transparent 70%);mask:linear-gradient(225deg,#000,transparent 70%)}
:root[data-look="pop"] .stamp{background:var(--paper);border-radius:6px;box-shadow:3px 3px 0 var(--hard)}
:root[data-look="pop"] .seg{height:8px;border-radius:0;border:2px solid var(--text);background:transparent}
:root[data-look="pop"] .seg.cur{background:var(--text)}
:root[data-look="pop"] .seg[data-c="yes"]{background:var(--yes)}
:root[data-look="pop"] .seg[data-c="no"]{background:var(--no)}
:root[data-look="pop"] .seg[data-c="later"]{background:var(--later)}
:root[data-look="pop"] .tag{background:#ffd23f;color:#151515;border:2px solid var(--hard);border-radius:6px}
:root[data-look="pop"] .chip,:root[data-look="pop"] .lab,:root[data-look="pop"] .risk,:root[data-look="pop"] .sample{border:2px solid var(--hard);border-radius:6px}
:root[data-look="pop"] .sample{color:#151515;background:#ffd23f}
:root[data-look="pop"] .btn{background:var(--paper);border:3px solid var(--hard);box-shadow:3px 3px 0 var(--hard-sh)}
:root[data-look="pop"] .btn:active{transform:translate(3px,3px);box-shadow:none;background:var(--c)}
:root[data-look="pop"] .gear{background:var(--paper);color:var(--paper-ink);border:3px solid var(--hard);border-radius:10px}
:root[data-look="pop"] .ob button,:root[data-look="pop"] .so{background:var(--paper);border:2px solid var(--hard);border-radius:8px;box-shadow:3px 3px 0 var(--hard)}
:root[data-look="pop"] .ob button[data-rec="1"],:root[data-look="pop"] .so[data-rec="1"]{background:#dff3e8;box-shadow:3px 3px 0 var(--yes-d);border-color:var(--yes-d)}
:root[data-look="pop"] .tile,:root[data-look="pop"] .save,:root[data-look="pop"] .cta{border:2px solid var(--text);border-radius:8px}
:root[data-look="pop"] .tile{box-shadow:3px 3px 0 var(--hard-sh)}
:root[data-look="pop"] .sheet-in{border-radius:14px 14px 0 0;border-top:3px solid var(--hard)}
:root[data-look="pop"] .pick button{border:2px solid var(--hard);border-radius:8px;box-shadow:2px 2px 0 var(--hard)}
/* flashy: 色相に合わせた濃いタグ、光る縁 */
:root[data-look="flashy"] .tag{background:hsl(var(--hue) 95% 68%);color:#141414}
:root[data-look="flashy"] .ob button,:root[data-look="flashy"] .so{background:hsl(var(--hue,250) 90% 95%);box-shadow:inset 0 0 0 2px hsl(var(--hue,250) 60% 75%)}
:root[data-look="flashy"] .ob button[data-rec="1"],:root[data-look="flashy"] .so[data-rec="1"]{box-shadow:inset 0 0 0 2px var(--yes-d)}

/* ---- ダーク: カードも暗い紙にする ---- */
:root[data-scheme="dark"]{--paper:#2a2824;--paper-ink:#f1e6c6;--paper-mute:#b3a888;
  --yes-d:#3fcf8e;--no-d:#ff6a5c;--later-d:#ffbf1f;--info-d:#7aa8ff;--hard:#f1e6c6;--hard-sh:#f1e6c6}
:root[data-look="calm"][data-scheme="dark"]{--paper:#26211a;--paper-ink:#efe7d6;--paper-mute:#a79c84;
  --yes-d:#58b08c;--no-d:#e0574b;--later-d:#d9a441;--info-d:#7fa3c6;--hard:#efe7d6;--hard-sh:#efe7d6}
:root[data-look="flashy"][data-scheme="dark"]{--paper:#1b1b20;--paper-ink:#f5f2ea;--paper-mute:#a9a69c;
  --yes-d:#12d6a0;--no-d:#ff4766;--later-d:#ffc02e;--info-d:#6a8dff;--hard:#f5f2ea;--hard-sh:#f5f2ea}
:root[data-scheme="dark"] .opt:not([aria-pressed="true"]){background:rgba(255,255,255,.07)}
:root[data-look="pop"][data-scheme="dark"] .ob button[data-rec="1"],:root[data-look="pop"][data-scheme="dark"] .so[data-rec="1"]{background:#173a2b}
:root[data-look="pop"][data-scheme="dark"] .card::before{opacity:.35}
:root[data-look="flashy"][data-scheme="dark"] .ob button,:root[data-look="flashy"][data-scheme="dark"] .so{background:hsl(var(--hue,250) 35% 22%);box-shadow:inset 0 0 0 2px hsl(var(--hue,250) 50% 40%)}
:root[data-look="flashy"][data-scheme="dark"] .card::before{opacity:.5}
</style>

     run: 今回の実行を区別するID(英数字とハイフン)。結果は db の results/<run> に保存される -->
<script type="application/json" id="config">{"look":"pop","mode":"auto","lang":"auto","run":"sample"}</script>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const root=document.documentElement;
const DATA=JSON.parse($('#cards').textContent), N=DATA.length;
DATA.forEach(c=>{
  c.hue=Number(c.hue)||0;
  if(c.hue>=255&&c.hue<=335) c.hue=c.hue<300?205:350; /* 紫系の色相は使わない */
  if(Array.isArray(c.options)&&c.options.length>=2){
    c.options=c.options.slice(0,4).map((o,k)=>Object.assign({},o,{id:String(o.id!=null?o.id:k+1)}));
    if(!c.options.some(o=>o.id===String(c.rec))) c.rec=c.options[0].id; else c.rec=String(c.rec);
  }else{
    c.options=null;
    c.rec=['yes','no','later'].indexOf(c.rec)>=0?c.rec:'later';
  }
});
let CFG={look:'pop',mode:'auto',lang:'auto'};
try{const el=$('#config');if(el) Object.assign(CFG,JSON.parse(el.textContent))}catch(_){}
function resolveScheme(){
  if(CFG.mode==='light'||CFG.mode==='dark') return CFG.mode;
  const th=root.getAttribute('data-theme');
  if(th==='light'||th==='dark') return th;
  return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
}
root.dataset.scheme=resolveScheme();

/* パーティクル */
const cv=$('#fx'),ctx=cv.getContext?cv.getContext('2d'):null;let parts=[],raf=0;
function resize(){if(!ctx) return;const r=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0)}
resize();addEventListener('resize',resize);
function tick(){
  raf=0;ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.34;p.vx*=.99;p.life-=p.d;p.r+=p.vr;
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=p.c;
    if(p.k===1){ctx.beginPath();ctx.arc(0,0,p.s*.45,0,6.283);ctx.fill()}
    else if(p.k===2){
      ctx.beginPath();
      for(let i=0;i<10;i++){const a=i*Math.PI/5,rad=i%2?p.s*.25:p.s*.7;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}
      ctx.closePath();ctx.fill();
    }else ctx.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6);
    ctx.restore();
  });
  if(parts.length) raf=requestAnimationFrame(tick);
}
function burst(x,y,color,n,spread){
  if(reduce||!ctx||!n) return;
  const lk=LK();
  for(let i=0;i<n;i++){
    parts.push({x:x,y:y,vx:(Math.random()-.5)*11*spread,vy:(Math.random()-.85)*11,life:1,d:.016+Math.random()*.02,
      s:5+Math.random()*6,c:lk.pal?lk.pal[(Math.random()*lk.pal.length)|0]:color,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      k:lk.shapes?(Math.random()*3)|0:0});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
/* 紙吹雪の雨(派手スタイル用)。画面の上から降り続ける */
function rain(ms){
  if(reduce||!ctx) return;
  const pal=LK().cpal||LK().pal||[HEX.yes,HEX.no,HEX.later,HEX.info],end=performance.now()+ms;
  (function drop(){
    for(let i=0;i<6;i++) parts.push({x:Math.random()*innerWidth,y:-12,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,life:1,d:.0055,
      s:6+Math.random()*7,c:pal[(Math.random()*pal.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.35,k:(Math.random()*3)|0});
    if(!raf) raf=requestAnimationFrame(tick);
    if(performance.now()<end) setTimeout(drop,70);
  })();
}
function confetti(){
  const lk=LK(),cols=lk.cpal||lk.pal||[HEX.yes,HEX.no,HEX.later,HEX.info],waves=lk.rain?10:6,n=lk.rain?50:34;
  for(let i=0;i<waves;i++) setTimeout(()=>burst(innerWidth*(i/(waves-1)),innerHeight*(.3+.1*(i%2)),cols[i%cols.length],n,1.7),i*110);
  if(lk.rain) rain(2600);
}

/* ---------- 決定 ---------- */
let pendingCf=null;
function commit(choice,dx,dy,optId,confirmed){
  if(idx>=N) return;
  const c0=DATA[idx];let pickId=null;
  if(isPick(c0)&&(choice==='yes'||choice==='pick')){pickId=String(optId!=null?optId:c0.rec);choice='yes'}
  if(c0.risk&&choice==='yes'&&!confirmed){
    layout();
    $('#cf-q').textContent=T(c0,'q');
    pendingCf=function(){commit(choice,dx,dy,pickId,true)};
    $('#cf').hidden=false;return;
  }
  const now=performance.now();
  if(!startT) startT=now;
  const el=els[idx],lk=LK();
  combo=(lastT&&now-lastT<2600)?combo+1:1;lastT=now;
  history.push({idx:idx,combo:combo});
  decisions[idx]=pickId?'pick':choice;picks[idx]=pickId;

  const r=el.getBoundingClientRect();
  const big=combo>=lk.thr[2];
  burst(choice==='yes'?r.right:choice==='no'?r.left:r.left+r.width/2,
        choice==='later'?r.top:r.top+r.height*.4,HEX[choice],big?lk.burst*2:lk.burst,big?1.6:1);
  if(lk.confetti&&combo===lk.thr[2]) confetti();

  el.style.setProperty('--s-'+choice,'1');
  const W=innerWidth,H=innerHeight,k=lk.tilt/.07;let tx,ty,rot;
  if(choice==='yes'){tx=W*1.3;ty=(dy||0)*.5-40;rot=28*k}
  else if(choice==='no'){tx=-W*1.3;ty=(dy||0)*.5-40;rot=-28*k}
  else{tx=(dx||0)*.5;ty=-H*1.1;rot=(dx||0)*lk.tilt*.6}
  el.classList.remove('drag');el.classList.add('fly');
  const tr='translate3d('+tx+'px,'+ty+'px,0) rotate('+rot+'deg)';
  el.style.transform=tr;el.style.opacity='0';el.dataset.out=tr;
  el.style.pointerEvents='none';

  buzz(choice);pulse(choice);
  if(lk.shakeEvery) shake('shake-s');
  showCombo();
  idx++;layout();
  if(idx>=N) setTimeout(finish,460);
}

function undo(){
  if(!history.length||idx<=0||!done.hidden) return;
  const h=history.pop();
  const el=els[h.idx];
  idx=h.idx;decisions[idx]=null;picks[idx]=null;
  combo=Math.max(0,h.combo-1);showCombo(true);
  el.classList.add('drag');
  el.style.transform=el.dataset.out||'translate3d(0,-900px,0)';el.style.opacity='0';
  void el.offsetWidth;
  layout();
}

/* ---------- ドラッグ ---------- */
let drag=null,moved=false;
function dirOf(dx,dy){
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ay>ax*1.1&&dy<0) return 'later';
  if(ay>ax*1.1&&dy>0) return 'info';
  if(dx>0) return 'yes';
  if(dx<0) return 'no';
  return null;
}
function feedback(el,dx,dy){
  const dir=dirOf(dx,dy);
  const dist=(dir==='later'||dir==='info')?Math.abs(dy):Math.abs(dx);
  const s=Math.min(1,dist/110);
  ['yes','no','later','info'].forEach(k=>el.style.setProperty('--s-'+k,k===dir?String(s):'0'));
  if(dir){glow.style.setProperty('--g',HEX[dir]);glow.style.opacity=String(s*LK().glow)}
}
stage.addEventListener('pointerdown',e=>{
  const el=els[idx];
  if(!el||!sheet.hidden||!setSheet.hidden||!$('#cf').hidden||!el.contains(e.target)) return;
  moved=false;
  if(!startT) startT=performance.now();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,vx:0,vy:0,lx:e.clientX,ly:e.clientY,lt:e.timeStamp,pending:!!e.target.closest('.ob button')};
  if(!drag.pending){el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(_){}}
});
stage.addEventListener('click',e=>{
  if(moved){moved=false;return}
  const b=e.target.closest('.ob button');
  if(!b||!sheet.hidden||!setSheet.hidden||!$('#cf').hidden||!els[idx]||!els[idx].contains(b)) return;
  commit('pick',0,0,b.dataset.o);
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const el=els[idx];
  drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
  if(drag.pending){
    if(Math.hypot(drag.dx,drag.dy)<10) return;
    drag.pending=false;moved=true;el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(_){}
  }
  const dt=e.timeStamp-drag.lt;
  if(dt>0){drag.vx=(e.clientX-drag.lx)/dt;drag.vy=(e.clientY-drag.ly)/dt}
  drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=e.timeStamp;
  el.style.transform='translate3d('+drag.dx+'px,'+drag.dy+'px,0) rotate('+(drag.dx*LK().tilt)+'deg)';
  feedback(el,drag.dx,drag.dy);
});
function release(e,cancel){
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag;drag=null;
  if(d.pending) return;
  const dir=dirOf(d.dx,d.dy);
  const dist=(dir==='later'||dir==='info')?Math.abs(d.dy):Math.abs(d.dx);
  const fast=Math.hypot(d.vx,d.vy)>.6;
  glow.style.opacity='0';
  if(!cancel&&dir&&(dist>95||(fast&&dist>30))){
    if(dir==='info'){layout();openSheet()}
    else commit(dir,d.dx,d.dy);
  }else{
    layout();
  }
}
stage.addEventListener('pointerup',e=>release(e,false));
stage.addEventListener('pointercancel',e=>release(e,true));

/* ---------- ボタン / キー ---------- */
controls.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b) return;
  if(b.id==='b-undo'){undo();return}
  const a=b.dataset.act;
  if(a==='info') openSheet(); else if(a) commit(a,0,0);
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!sheet.hidden||!setSheet.hidden||!$('#cf').hidden){if(e.key==='Escape'){sheet.hidden=true;setSheet.hidden=true;$('#cf').hidden=true;pendingCf=null}return}
  if(!done.hidden) return;
  const m={ArrowRight:'yes',ArrowLeft:'no',ArrowUp:'later'};
  if(m[e.key]){e.preventDefault();commit(m[e.key],0,0)}
  else if(e.key==='ArrowDown'){e.preventDefault();openSheet()}
  else if(/^[1-4]$/.test(e.key)&&DATA[idx]&&DATA[idx].options&&DATA[idx].options[+e.key-1]){commit('pick',0,0,DATA[idx].options[+e.key-1].id)}
  else if(e.key==='u'||e.key==='Backspace'){undo()}
});

sheet.addEventListener('click',e=>{
  if(e.target===sheet||e.target.id==='s-close'){sheet.hidden=true;return}
  const so=e.target.closest('[data-o]');
  if(so){sheet.hidden=true;commit('pick',0,0,so.dataset.o);return}
  const p=e.target.closest('[data-pick]');
  if(p){sheet.hidden=true;commit(p.dataset.pick,0,0)}
});

$('#cf').addEventListener('click',e=>{
  const b=e.target.closest('[data-cf]');
  if(e.target===$('#cf')||(b&&b.dataset.cf==='back')){$('#cf').hidden=true;pendingCf=null;return}
  if(b&&b.dataset.cf==='ok'){const f=pendingCf;pendingCf=null;$('#cf').hidden=true;if(f) f()}
});

/* ---------- 設定(スタイル・配色・言語) ---------- */
const ROWS=[
  {k:'look',label:'style',opts:[['calm','styleCalm'],['pop','stylePop'],['flashy','styleFlashy']]},
  {k:'mode',label:'mode',opts:[['auto','auto'],['light','light'],['dark','dark']]},
  {k:'lang',label:'lang',opts:[['auto','auto'],['ja',null,'日本語'],['en',null,'English']]}
];
function renderSettings(){
  $('#set-rows').innerHTML=ROWS.map(r=>
    '<div class="srow"><span class="slabel">'+esc(t(r.label))+'</span><div class="sopts" role="group" aria-label="'+esc(t(r.label))+'">'+
    r.opts.map(o=>'<button class="opt" data-k="'+r.k+'" data-v="'+o[0]+'" aria-pressed="'+(CFG[r.k]===o[0])+'">'+esc(o[1]?t(o[1]):o[2])+'</button>').join('')+
    '</div></div>').join('');
}
$('#b-set').addEventListener('click',()=>{renderSettings();setSheet.hidden=false});
setSheet.addEventListener('click',e=>{
  if(e.target===setSheet||e.target.id==='set-close'){setSheet.hidden=true;return}
  const b=e.target.closest('.opt');if(!b) return;
  CFG[b.dataset.k]=b.dataset.v;
  applyPrefs();renderSettings();
});
function applyPrefs(){
  L=resolveLang();
  root.dataset.look=LOOKS[CFG.look]?CFG.look:'pop';
  root.dataset.mode=CFG.mode==='light'||CFG.mode==='dark'?CFG.mode:'auto';
  root.dataset.scheme=resolveScheme();
  root.lang=L;
  const sb=document.getElementById('sample-badge');if(sb) sb.hidden=String(CFG.run||'sample')!=='sample';
  document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n)});
  document.querySelectorAll('[data-i18n-aria]').forEach(n=>{n.setAttribute('aria-label',t(n.dataset.i18nAria))});
  els.forEach((el,i)=>fill(el,DATA[i],i));
  if(!LK().thr||LK().thr[0]>=99){comboEl.textContent='';comboEl.removeAttribute('data-lv');document.body.dataset.heat='0'}
  layout();
  if(!done.hidden&&result){renderDone();if(saveState) setStatus(saveState)}
}

/* ---------- 結果 ---------- */
function payloadOf(r){
  const items=DATA.map((c,i)=>{
    const ch=r.decisions[i],it={id:c.id,question:T(c,'q'),choice:ch,claude_recommended:c.rec,contrarian:!agreeOf(c,i)};
    if(ch==='pick'){it.picked=String(r.picks[i]);it.picked_label=optT(optOf(c,r.picks[i]),'label')}
    if(ch==='no'&&T(c,'if_no')) it.if_no=T(c,'if_no');
    if(c.risk) it.risk=true;
    return it;
  });
  return {decided_in_seconds:Number(r.sec.toFixed(1)),summary:{go:r.counts.yes,nope:r.counts.no,later:r.counts.later,contrarian:N-r.agree},decisions:items};
}
function resultText(r){
  return t('intro')+'\n```json\n'+JSON.stringify(payloadOf(r),null,2)+'\n```';
}

/* ---------- 保存してClaudeに直接読ませる(db)。使えない・失敗したらコピペに任せる ---------- */
function setStatus(s){
  saveState=s;
  const el=$('#d-save');
  el.hidden=false;el.dataset.s=s;el.textContent=t('save_'+s);
}
function getDb(){
  try{
    if(window.claude&&typeof window.claude.use==='function') return Promise.resolve(window.claude.use('db')).catch(()=>null);
  }catch(_){}
  return Promise.resolve(null);
}
async function saveResult(){
  const tok=++saveTok,r=result;
  setStatus('saving');
  try{
    const db=await Promise.race([getDb(),new Promise(res=>setTimeout(()=>res(null),12000))]);
    if(tok!==saveTok) return;
    if(!db){setStatus('none');return}
    const run=String(CFG.run||'sample').replace(/[^A-Za-z0-9_.~:@+-]/g,'-').slice(0,100)||'sample';
    await db.doc('results/'+run).set(Object.assign({run:run,status:'done',decided_at:new Date().toISOString(),lang:L},payloadOf(r)));
    if(tok!==saveTok) return;
    setStatus('ok');
  }catch(_){
    if(tok===saveTok) setStatus('fail');
  }
}
function renderDone(){
  const r=result,contra=N-r.agree;
  $('#d-head').textContent=t('head',N,r.sec.toFixed(1));
  $('#t-yes').textContent=r.counts.yes;$('#t-no').textContent=r.counts.no;$('#t-later').textContent=r.counts.later;
  $('#d-agree').innerHTML=t('agree',r.agree,N,contra);
  $('#d-list').innerHTML=DATA.map((c,i)=>{
    const ch=r.decisions[i],same=agreeOf(c,i),dc=ch==='pick'?'yes':ch;
    return '<li class="row"><span class="lab" data-c="'+dc+'">'+esc(decLabel(c,i))+'</span><p>'+esc(T(c,'q'))+
      (ch==='no'&&T(c,'if_no')?'<small>'+esc(t('ifNo')+': '+T(c,'if_no'))+'</small>':'')+
      (same?'':'<small>'+esc(t('contra',recLabelOf(c)))+'</small>')+'</p></li>';
  }).join('');
  $('#out').value=resultText(r);
}
function finish(){
  const sec=(performance.now()-startT)/1000;
  const counts={yes:0,no:0,later:0};let agree=0;
  DATA.forEach((c,i)=>{counts[decisions[i]==='pick'?'yes':decisions[i]]++;if(agreeOf(c,i)) agree++});
  result={sec:sec,counts:counts,agree:agree,decisions:decisions.slice(),picks:picks.slice()};
  stage.hidden=true;controls.hidden=true;hint.hidden=true;comboEl.textContent='';
  done.hidden=false;done.scrollTop=0;
  renderDone();
  saveResult();
  if(LK().confetti) confetti();
  buzz('yes');
}
$('#b-copy').addEventListener('click',()=>{
  const text=resultText(result);
  const fallback=()=>{const d=$('#d-details');d.open=true;const ta=$('#out');ta.focus();ta.select();toast(t('selected'))};
  try{
    navigator.clipboard.writeText(text).then(()=>toast(t('copied')),fallback);
  }catch(_){fallback()}
});
$('#b-again').addEventListener('click',()=>{
  idx=0;combo=0;lastT=0;startT=0;history=[];decisions.fill(null);picks.fill(null);result=null;
  saveTok++;saveState=null;$('#d-save').hidden=true;
  done.hidden=true;stage.hidden=false;controls.hidden=false;hint.hidden=false;
  document.body.dataset.heat='0';
  layout();
});

applyPrefs();
})();
</script>
